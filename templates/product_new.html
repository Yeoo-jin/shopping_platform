{% extends "base.html" %}{% block content %}
<div class="panel form-panel"><h2>상품 등록</h2><p class="section-lead">상품의 매력이 잘 보이는 사진과 설명을 올려주세요.</p><form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>상품 사진<input type="file" name="image" accept="image/png,image/jpeg,image/gif,image/webp"></label>
<p class="hint">PNG, JPG, GIF, WEBP · 최대 2MB</p>
<label>상품명<input name="title" maxlength="80" required></label>
<label>설명<textarea name="description" maxlength="1000" required></textarea></label>
<label>가격<input type="number" name="price" min="0" max="100000000" required></label>
<button>등록</button></form></div>{% endblock %}
